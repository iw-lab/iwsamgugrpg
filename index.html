<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a0f08" />
    <title>한조재흥기 · The Rise of Han</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0704;
        font-family:
          'Nanum Myeongjo', 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
        color: #e8d9a8;
        -webkit-user-select: none;
        user-select: none;
      }
      #game-root {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d0704;
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        font-size: 2.4rem;
        margin: 0 0 0.4rem;
        letter-spacing: 0.4rem;
        color: #d4af37;
      }
      #loading p {
        margin: 0;
        font-size: 0.9rem;
        color: #8a7245;
        letter-spacing: 0.2rem;
      }
      .loader {
        margin-top: 2rem;
        width: 48px;
        height: 48px;
        border: 3px solid #3a2817;
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Cinzel:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="loading">
      <h1>漢祖再興記</h1>
      <p>한조재흥기 · The Rise of Han</p>
      <div class="loader"></div>
    </div>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
